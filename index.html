<header><div class="brand">Curso de Contabilidade Professor Moreira</div><div class="topic">CPC 31 • Ativo Não Circulante Mantido para Venda</div></header>
<div class="wrap"><div class="top"><span class="chip" id="counter">Tela 1</span><span class="chip">📘 Somente teoria</span></div><div class="progress" aria-label="Progresso da aula"><div id="bar"></div></div><main id="screen" tabindex="-1" aria-live="polite"></main><footer>Material de estudo adaptado da parte teórica do PDF fornecido • Sem questões e sem gabarito</footer></div>
<nav><div class="buttons"><button id="prev" type="button">← Voltar</button><button id="restart" class="reset" type="button">↻ Reiniciar</button><button id="next" class="primary" type="button">Avançar →</button></div></nav>
<script>
const slides=[
`<div class="brand-cover">CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</div><div class="hero">ATIVO NÃO CIRCULANTE<br>MANTIDO PARA VENDA</div><div style="text-align:center"><span class="tag">CPC 31 • TEORIA</span></div><p style="text-align:center">Aprenda os critérios de classificação, a mensuração e a apresentação contábil.</p><div class="note info">Use as setas para estudar, voltar e revisar. O progresso é salvo automaticamente neste aparelho.</div>`,
`<h2>1. Conceito essencial</h2><p>Um ativo não circulante deve ser classificado como <strong>mantido para venda</strong> quando seu valor contábil for recuperado <strong>principalmente por uma transação de venda</strong>, e não pelo uso contínuo.</p><div class="note good"><strong>Ideia principal:</strong> a entidade pretende recuperar o valor do ativo vendendo-o.</div>`,
`<h2>2. Disponibilidade imediata</h2><p>Para essa classificação, o ativo ou grupo de ativos deve estar <strong>disponível para venda imediata</strong>, nas suas condições atuais.</p><p>São admitidos apenas os termos habituais e costumeiros para a venda de ativos semelhantes.</p><div class="note">A decisão de vender, isoladamente, não basta.</div>`,
`<h2>3. Venda altamente provável</h2><p>A venda precisa ser <strong>altamente provável</strong>.</p><ul><li>A gestão apropriada deve estar comprometida com o plano de venda.</li><li>Deve existir um programa firme para localizar um comprador.</li><li>O plano deve buscar a efetiva conclusão da transação.</li></ul>`,
`<h2>4. Preço e prazo</h2><ul><li>O ativo deve ser colocado à venda por <strong>preço razoável</strong>, em relação ao seu valor justo corrente.</li><li>Espera-se que a venda seja concluída em <strong>até um ano</strong> da classificação, ressalvadas as exceções.</li><li>Deve ser improvável uma alteração significativa ou o abandono do plano.</li></ul>`,
`<h2>5. Critérios para memorizar</h2><div class="grid"><div>VENDA<span>Recuperação do valor pela alienação</span></div><div>IMEDIATA<span>Ativo pronto para vender</span></div><div>GESTÃO<span>Compromisso com o plano</span></div><div>COMPRADOR<span>Busca efetiva iniciada</span></div><div>PREÇO<span>Razoável em relação ao justo</span></div><div>PRAZO<span>Previsão de até um ano</span></div></div>`,
`<h2>6. Como mensurar</h2><p>O ativo ou o grupo de ativos não circulantes classificado como mantido para venda deve ser mensurado pelo <strong>menor valor</strong> entre:</p><div class="formula">VALOR CONTÁBIL<br>OU<br>VALOR JUSTO − DESPESAS DE VENDA</div><div class="note info">Escolha sempre o <strong>MENOR</strong> dos dois valores.</div>`,
`<h2>7. Quando há perda</h2><p>Se o <strong>valor contábil for maior</strong> que o valor justo menos as despesas de venda, a diferença reduz a mensuração do ativo e é reconhecida como <strong>perda no resultado (despesa)</strong>.</p><div class="note bad">Valor contábil MAIOR → reconhecer a diferença como perda.</div>`,
`<h2>8. Quando não há redução</h2><p>Se o <strong>valor contábil for menor</strong> que o valor justo menos as despesas de venda, mantém-se o valor contábil.</p><div class="note good">Valor contábil MENOR → o ativo continua pelo valor contábil.</div><p>Não há aumento automático do ativo até o valor justo apenas porque este é maior.</p>`,
`<h2>9. Depreciação e amortização</h2><p>Após ser classificado como mantido para venda, o ativo <strong>não sofre depreciação nem amortização</strong>.</p><div class="note good">A depreciação ou amortização cessa a partir da classificação.</div><p>O valor apresentado permanece sujeito às regras pertinentes de mensuração e reconhecimento de perdas.</p>`,
`<h2>10. Apresentação no Balanço</h2><p>O ativo não circulante classificado como mantido para venda deve aparecer <strong>separadamente dos demais ativos</strong> no Balanço Patrimonial.</p><div class="note info">O material destaca sua apresentação separada no <strong>Ativo Circulante</strong>, em conta específica de ativo mantido para venda.</div>`,
`<h2>11. Operações descontinuadas</h2><p>O material destaca que os <strong>resultados das operações descontinuadas</strong> devem ser apresentados separadamente na Demonstração do Resultado do Exercício (DRE).</p><div class="note">A apresentação separada facilita a identificação desses resultados nas demonstrações contábeis.</div>`,
`<h2>12. Venda após um ano</h2><p>O prazo normalmente esperado é de até um ano, mas ele <strong>pode ser estendido</strong> sem perder a classificação se:</p><ul><li>o atraso decorrer de circunstâncias <strong>fora do controle da entidade</strong>; e</li><li>houver <strong>evidência suficiente</strong> de que a entidade continua comprometida com o plano de venda.</li></ul>`,
`<h2>13. Exceção: condições inesperadas</h2><p>O PDF aborda o caso de <strong>compromisso firme de compra</strong> no qual o comprador impõe inesperadamente condições que prolongam a transferência.</p><p>Para a exceção, devem ter sido tomadas, oportunamente, as ações necessárias e deve ser esperada <strong>solução favorável</strong> para os fatores do atraso.</p>`,
`<h2>14. Itens destacados pelo material</h2><p>O PDF relaciona categorias sujeitas a tratamentos específicos, citando:</p><ul><li>Imposto de renda diferido;</li><li>Ativos provenientes de benefícios a empregados;</li><li>Propriedade para investimento;</li><li>Ativos biológicos.</li></ul><div class="note info">A relação é apresentada no material como ressalva à classificação. A aplicação do CPC 31 a essas categorias exige atenção às normas específicas.</div>`,
`<h2>15. Resumo para a FGV</h2><ul><li>Recuperação do valor <strong>pela venda</strong>, e não pelo uso.</li><li>Ativo disponível para <strong>venda imediata</strong>.</li><li>Venda <strong>altamente provável</strong>.</li><li>Gestão comprometida e <strong>busca de comprador</strong> iniciada.</li><li>Preço razoável e expectativa de venda em <strong>até um ano</strong>, com exceções.</li></ul>`,
`<h2>16. Resumo da mensuração</h2><div class="formula">MENOR VALOR:<br>CONTÁBIL<br>×<br>JUSTO LÍQUIDO DAS DESPESAS DE VENDA</div><ul><li>Se houver diferença desfavorável: <strong>perda no resultado</strong>.</li><li><strong>Sem depreciação ou amortização</strong> após a classificação.</li><li><strong>Apresentação separada</strong> no Balanço Patrimonial.</li></ul>`,
`<div class="finish"><div class="hero">PARABÉNS! 🎓</div><h2>Você concluiu a teoria!</h2><p>Revise especialmente a <strong>venda altamente provável</strong>, a <strong>mensuração pelo menor valor</strong> e a <strong>exceção do prazo de um ano</strong>.</p><div class="note good">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><button class="reset" onclick="go(0)">↻ Estudar novamente</button></div>`
];
const key='moreira-cpc31-teoria-slide-v1';let current=0;try{const stored=Number(localStorage.getItem(key));if(Number.isInteger(stored)&&stored>=0&&stored<slides.length)current=stored}catch(e){}
const screen=document.getElementById('screen'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),prev=document.getElementById('prev'),next=document.getElementById('next');
function render(){screen.innerHTML=slides[current];counter.textContent=`Tela ${current+1} de ${slides.length}`;bar.style.width=`${(current+1)/slides.length*100}%`;prev.disabled=current===0;next.disabled=current===slides.length-1;next.textContent=current===slides.length-1?'Concluído ✓':'Avançar →';try{localStorage.setItem(key,String(current))}catch(e){}window.scrollTo({top:0,behavior:'instant'});}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}
prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));document.getElementById('restart').addEventListener('click',()=>{if(confirm('Deseja voltar à primeira tela?'))go(0)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});let startX=null;screen.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});screen.addEventListener('touchend',e=>{if(startX===null)return;let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>90)go(current+(d<0?1:-1));startX=null},{passive:true});render();
</script></body></html>
